# Neon Nexus: кэширование статики Mini App (P2).
# Подключается ВНУТРИ server { } сайта строкой:  include snippets/neon-nexus-cache.conf;
# root берётся из server { }. Если root задан только внутри location / — раскомментируйте root ниже в каждом блоке.
# Важно: add_header внутри location отменяет add_header уровня server (их нужно повторить здесь, если они есть).

# index.html — всегда сверяться с сервером: после деплоя игрок сразу получает новую сборку.
# Сюда же попадает SPA-фолбэк try_files ... /index.html (внутренний переход на /index.html).
location = /index.html {
    # root /opt/taskbot_test/miniapp/frontend/dist;
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires off;
    etag on;
}

# Версия сборки: клиент опрашивает её, чтобы заметить новый деплой (frontend/src/lib/version.ts).
location = /version.json {
    # root /opt/taskbot_test/miniapp/frontend/dist;
    add_header Cache-Control "no-store" always;
    expires off;
    try_files $uri =404;
}

# Service worker (сейчас его нет; правило на будущее — sw.js не должен залипать в кэше).
location ~ ^/(sw|service-worker)\.js$ {
    # root /opt/taskbot_test/miniapp/frontend/dist;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    expires off;
    try_files $uri =404;
}

# Файлы сборки с хэшем в имени (index-AbC123.js, *.css, картинки, шрифты): год и immutable.
# Нет файла — честный 404, а не index.html (иначе старый клиент получит HTML вместо JS).
location ^~ /assets/ {
    # root /opt/taskbot_test/miniapp/frontend/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
}
